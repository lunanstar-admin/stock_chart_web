    section.box .long { font-size: 14px; color: var(--text-secondary); line-height: 1.7; white-space: pre-line; }
    .figs { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
    .fig { background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; }

    .vctx span { white-space: nowrap; color: var(--text-secondary); }
    .vctx b { color: var(--text-primary); font-weight: 600; margin-right: 4px; }
    section.box.valuation { background: rgba(37, 99, 235, 0.04); border-color: rgba(37, 99, 235, 0.15); }
    @media (prefers-color-scheme: dark) {
      section.box.valuation { background: rgba(96, 165, 250, 0.07); border-color: rgba(96, 165, 250, 0.2); }
    }
    .detail-disclaimer-top {
      background: #fef3c7; border: 1px solid #fcd34d; border-radius: 8px;
      padding: 10px 14px; margin-bottom: 16px;
      font-size: 12px; line-height: 1.55; color: #78350f;
    }
    @media (prefers-color-scheme: dark) {
      .detail-disclaimer-top { background: rgba(251, 191, 36, 0.1); border-color: rgba(251, 191, 36, 0.35); color: #fde68a; }
    }
    .valuation-warn {
      margin-top: 12px; padding: 8px 12px;
      background: rgba(220, 38, 38, 0.06); border-left: 3px solid #dc2626;
      font-size: 12px; color: var(--text-secondary); line-height: 1.5;
    }
    @media (prefers-color-scheme: dark) {
      .valuation-warn { background: rgba(248, 113, 113, 0.1); color: #fca5a5; }

    .detail-disclaimer-bottom {

    .source-link { display: inline-block; color: #2563eb; text-decoration: none; font-size: 14px; }
    .source-link:hover { text-decoration: underline; }

  </div>

<script>
(function () {
  const params = new URLSearchParams(window.location.search);
  const rceptNo = params.get('rcept_no');
  const $content = document.getElementById('content');

  if (!rceptNo) {
    $content.innerHTML = '<p class="empty">잘못된 접근 — rcept_no 파라미터가 없습니다.</p>';
    return;
  }

  function fmtDate(ts) {
    if (!ts) return '';
    const d = new Date(ts * 1000);
    return d.toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' });
  }
  function fmtPct(v) {
    if (v === null || v === undefined) return '-';
    const sign = v > 0 ? '+' : '';
    return `${sign}${v.toFixed(2)}%`;
  }
  function fmtKRW(v) {
    if (v === null || v === undefined) return '-';
    const abs = Math.abs(v);
    if (abs >= 1e12) return `${(v / 1e12).toFixed(1)}조`;
    if (abs >= 1e8)  return `${(v / 1e8).toFixed(0)}억`;
    if (abs >= 1e4)  return `${(v / 1e4).toFixed(0)}만`;
    return v.toLocaleString('ko-KR');
  }
  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  Promise.all([
    fetch(`/data/dart/detail/${rceptNo}.json`).then(r => r.ok ? r.json() : null).catch(() => null),
    fetch('/data/dart/disclosures.json').then(r => r.json()).catch(() => null),
  ]).then(([detail, index]) => {
    // detail이 없으면 index에서 fallback (LLM 요약 X, impact X)
    let item = detail;
    if (!item && index) {
      item = (index.items || []).find(x => x.rcept_no === rceptNo);
    }
    if (!item) {
      $content.innerHTML = '<p class="empty">공시를 찾을 수 없습니다.</p>';
      return;
    }
    render(item);
  });

  function render(it) {
    const sent = it.sentiment || 'neutral';
    const sentEmoji = sent === 'positive' ? '🚀 호재' : sent === 'negative' ? '⚠️ 악재' : '📋 중립';
    const conf = (it.confidence !== undefined && it.confidence !== null && it.confidence > 0)
      ? ` (신뢰도 ${(+it.confidence).toFixed(2)})` : '';

    // 페이지 title 동적 갱신
    document.title = `${it.name || ''} ${it.report_nm || ''} — 세콤달.콤`;

    let html = `
      <a class="detail-back" href="/dart">← 목록으로</a>
      <div class="detail-disclaimer-top">
        ⚠️ 아래 AI 요약·밸류에이션 논평은 <b>단순 참고자료</b>이며, 투자 판단은 본인이 직접 하셔야 합니다.
      </div>
      <div class="detail-head">
        <div>
          <span class="name">${escapeHtml(it.name)}</span>
          <span class="code">${escapeHtml(it.code)}</span>
          <span class="chip ${sent}">${sentEmoji}${conf}</span>
        </div>
        <div class="report">${escapeHtml(it.report_nm)}</div>
        <div class="date">접수 ${fmtDate(it.ts_epoch)}</div>
      </div>`;

    if (it.summary_short) {
      html += `
        <section class="box">
          <h3>AI 요약 (Claude Haiku)</h3>
          <div class="lead">${escapeHtml(it.summary_short)}</div>
          ${it.summary_long ? `<div class="long">${escapeHtml(it.summary_long)}</div>` : ''}
        </section>`;
    }

    // 밸류에이션 논평 — 정기공시 + stock_db 데이터 있을 때만 LLM이 생성
    if (it.valuation_comment) {
      const vctx = (() => {
        try {
          return typeof it.valuation_context === 'string'
            ? JSON.parse(it.valuation_context)
            : it.valuation_context;
        } catch { return null; }
      })();
      let snapshot = '';
      if (vctx) {
        const num = (v) => v == null ? '-' : Number(v).toLocaleString('ko-KR');
        const fmtP = (v) => v == null ? '-' : Number(v).toFixed(2);
        const fmtPct = (v) => v == null ? '-' : Number(v).toFixed(2) + '%';
        snapshot = `
          <div class="vctx">
            <span><b>현재가</b> ${num(vctx.close_price)}원</span>
            <span><b>시총</b> ${vctx.market_cap ? (vctx.market_cap / 1e8).toLocaleString('ko-KR', {maximumFractionDigits:0}) + '억' : '-'}</span>
            <span><b>PER</b> ${fmtP(vctx.per)}</span>
            <span><b>PBR</b> ${fmtP(vctx.pbr)}</span>
            <span><b>EPS</b> ${num(vctx.eps)}</span>
            <span><b>BPS</b> ${num(vctx.bps)}</span>
            <span><b>ROE</b> ${fmtPct(vctx.roe)}</span>
          </div>`;
      }
      html += `
        <section class="box valuation">
          <h3>밸류에이션 논평 (현재 주가 대비)</h3>
          ${snapshot}
          <div class="long" style="margin-top:10px">${escapeHtml(it.valuation_comment)}</div>
          <div class="valuation-warn">
            ※ AI(Claude Haiku)가 공시 본문과 stock_db의 현재 시점 시총·PER·PBR·연간 실적을 결합해 자동 생성한 의견입니다.
            실시간 시세·업종 평균·시장 컨센서스 반영 안 됨. 분석 시점 이후 주가·실적 변동은 미반영.
            <b>매수·매도 추천이 아니며 단순 참고용</b>입니다.
          </div>
        </section>`;
    }

    const kf = it.key_figures;
    if (kf && typeof kf === 'object') {
      const cells = [];
      if (kf.revenue_yoy_pct !== null && kf.revenue_yoy_pct !== undefined)
        cells.push({ lbl: '매출 YoY', val: fmtPct(kf.revenue_yoy_pct) });
      if (kf.op_yoy_pct !== null && kf.op_yoy_pct !== undefined)
        cells.push({ lbl: '영업이익 YoY', val: fmtPct(kf.op_yoy_pct) });
      if (kf.net_yoy_pct !== null && kf.net_yoy_pct !== undefined)
        cells.push({ lbl: '순익 YoY', val: fmtPct(kf.net_yoy_pct) });
      if (kf.revenue_amount !== null && kf.revenue_amount !== undefined)
        cells.push({ lbl: '매출액', val: fmtKRW(kf.revenue_amount) });
      if (kf.op_amount !== null && kf.op_amount !== undefined)
        cells.push({ lbl: '영업이익', val: fmtKRW(kf.op_amount) });
      if (cells.length || kf.extra) {
        html += `
          <section class="box">
            <h3>핵심 수치</h3>
            <div class="figs">
              ${cells.map(c => `<div class="fig"><div class="lbl">${c.lbl}</div><div class="val">${c.val}</div></div>`).join('')}
            </div>
            ${kf.extra ? `<div class="long" style="margin-top:10px">${escapeHtml(kf.extra)}</div>` : ''}
          </section>`;
      }
    }

    const im = it.impact;
    if (im) {
      const cls = (v) => v == null ? '' : v >= 0 ? 'pos' : 'neg';
      html += `
        <section class="box">
          <h3>주가 영향 (영업일 기준, 공시 직전 종가 대비)</h3>
          <div class="impact">
            <div class="col"><div class="lbl">T+0</div><div class="val ${cls(im.ret_t0)}">${fmtPct(im.ret_t0)}</div></div>
            <div class="col"><div class="lbl">T+5</div><div class="val ${cls(im.ret_t5)}">${fmtPct(im.ret_t5)}</div></div>
            <div class="col"><div class="lbl">T+20</div><div class="val ${cls(im.ret_t20)}">${fmtPct(im.ret_t20)}</div></div>
          </div>
        </section>`;
    }

    if (it.url) {
      html += `<p><a class="source-link" href="${escapeHtml(it.url)}" target="_blank" rel="noopener noreferrer">DART 본문 보기 →</a></p>`;
    }

    html += `
      <div class="detail-disclaimer-bottom">
        <b>※ 본 페이지는 단순 참고자료입니다.</b><br />
        여기 제공되는 공시 요약·호재/악재 분류·AI 밸류에이션 논평·핵심 수치·주가 영향 데이터는
        모두 공개 정보(DART OpenAPI, stock_db 시장 데이터)를 기계적으로 가공한 결과이며,
        정확성·완전성·시의성을 보장하지 않습니다.
        특정 종목에 대한 매수·매도 추천이 아니며, 투자에 따른 손익은 전적으로 투자자 본인의 책임입니다.
        구체적 투자 판단은 본인이 직접 공시 본문·재무제표·시장 상황을 종합적으로 검토한 후 결정하시기 바랍니다.
      </div>`;

    $content.innerHTML = html;
  }
})();
</script>
