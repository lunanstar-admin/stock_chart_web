name: fda-realtime

# 국내 바이오기업 FDA 속보 — DART 공시 + FDA Newsroom RSS 를 15분 주기로
# 리스닝해, 신규 항목 발견 시 web/data/fda_alerts.json 갱신 + iOS 푸시 발송.
# openFDA 배치(daily-batch)보다 훨씬 빠른 '속보' 채널.

on:
  schedule:
    # 15분 주기 (GH cron 은 best-effort — 지연/누락 가능).
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "DART 조회 기간 (일)"
        required: false
        default: "3"

permissions:
  contents: write

concurrency:
  group: fda-realtime
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal deps
        run: python -m pip install --upgrade pip requests

      - name: Scan DART + FDA RSS
        env:
          PYTHONUNBUFFERED: "1"
          TZ: Asia/Seoul
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python -m batch.fda_realtime --output web/data --days "${{ github.event.inputs.days || '3' }}"

      - name: Commit & push alerts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/fda_alerts.json web/data/fda_alerts_state.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 스킵."
            exit 0
          fi
          DATE=$(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M KST')
          git commit -m "chore(fda): realtime alerts ${DATE}"
          # daily-batch 등과 동시 커밋 경합 대비 — rebase 후 재시도
          for i in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            if git rebase "origin/${GITHUB_REF_NAME}"; then
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            else
              git rebase --abort
              git merge -X ours "origin/${GITHUB_REF_NAME}" --no-edit && \
                git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            fi
            echo "push retry $i..." && sleep 5
          done
          exit 1
