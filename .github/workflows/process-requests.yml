name: process-blog-requests

# 관리자 블로그 요청 큐 처리 — Supabase polling + Claude Haiku + git commit.
# 30분 cron + 수동 트리거.

on:
  schedule:
    - cron: "*/30 * * * *"   # 매 30분 (UTC)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: process-blog-requests
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps (minimal)
        run: |
          python -m pip install --upgrade pip
          # 이미 repo 안의 batch 모듈은 표준 라이브러리만 사용 — extra 설치 없음
          pip install --quiet -r requirements.txt 2>/dev/null || true

      - name: Run processor
        env:
          PYTHONUNBUFFERED: "1"
          TZ: Asia/Seoul
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-haiku-4-5' }}
        run: |
          python -m batch.process_blog_requests

      - name: Build blog (incremental — picks up new .md)
        run: |
          python -m batch.build_blog || true

      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/posts web/blog web/data/recent-posts.json web/sitemap.xml web/rss.xml 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "변경 없음."
            exit 0
          fi
          DATE=$(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M')
          git commit -m "chore(blog-req): 관리자 요청 처리 ${DATE}"
          for i in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            if git rebase "origin/${GITHUB_REF_NAME}"; then
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            else
              git rebase --abort || true
              sleep 5
            fi
          done
          echo "push 실패 — 다음 cron 에서 재시도"
          exit 0
