name: daily-batch

on:
  schedule:
    # GitHub Actions schedule 은 best-effort — 부하/장애 시 일부 fire 가 누락될 수 있음.
    # 2026-05-18 사고: 3개 cron 모두 silently skipped → 종일 데이터 갱신 안 됨.
    # 대응: fire 횟수를 5개로 확장 + 정각/정각15분 같은 GH 부하 시점 회피.
    # 동일 데이터 재수집은 idempotent (skip 로직이 cutoff 비교)라서 다중 트리거 안전.
    - cron: "35 6 * * 1-5"     # 1차: 15:35 KST (장마감 5분 후)
    - cron: "55 6 * * 1-5"     # 2차: 15:55 KST (1차 누락 대비)
    - cron: "30 7 * * 1-5"     # 3차: 16:30 KST
    - cron: "10 9 * * 1-5"     # 4차: 18:10 KST (모든 사이트가 정각 피해 분산)
    - cron: "30 13 * * 1-5"    # 5차 최후 안전망: 22:30 KST (저녁 늦게라도 보강)
  workflow_dispatch:
    inputs:
      limit:
        description: "처리할 종목 수 상한 (디버그용, 비워두면 전종목)"
        required: false
        default: ""
      workers:
        description: "병렬 워커 수"
        required: false
        default: "8"
      force_brief:
        description: "주말이어도 시장 분석 글 강제 생성 (LLM 테스트용)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: daily-batch
  cancel-in-progress: false

jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 이중/삼중 cron 으로 fire 되었을 때, 이미 오늘자 데이터가 수집돼 있으면
      # 비싼 pip install / 데이터 수집 단계를 모두 건너뛴다.
      # workflow_dispatch 로 강제 실행한 경우에는 항상 진행.
      - name: Skip if today's post-close data already collected
        id: freshness
        # 장 마감(15:30 KST) 이후의 수집만 "오늘 데이터" 로 인정.
        # 자정~15:35 사이의 배치는 전일 종가 데이터라, 이후 fire 를 스킵하지 않도록 한다.
        # workflow_dispatch 로 강제 실행한 경우엔 항상 진행.
        run: |
          SKIP="false"
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ -f web/data/meta.json ]; then
            LAST_TS=$(python3 -c "import json; print(json.load(open('web/data/meta.json'))['updated'])" 2>/dev/null || echo "")
            TODAY=$(TZ=Asia/Seoul date +'%Y-%m-%d')
            CUTOFF="${TODAY}T15:35:00+09:00"
            # 문자열 ISO8601 비교는 사전식 정렬과 시간순이 동일.
            if [ -n "$LAST_TS" ] && [ "$LAST_TS" \> "$CUTOFF" ]; then
              echo "오늘($TODAY) 장마감 후 데이터 이미 수집됨 ($LAST_TS > $CUTOFF). 스킵."
              SKIP="true"
            else
              echo "마지막 수집=$LAST_TS · 컷오프=$CUTOFF · 진행."
            fi
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.freshness.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        if: steps.freshness.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run batch
        if: steps.freshness.outputs.skip != 'true'
        env:
          PYTHONUNBUFFERED: "1"
          TZ: Asia/Seoul
          # LLM provider — 설정 우선순위: LLM_PROVIDER > anthropic 키 > gemini 키 > 템플릿 폴백
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || '' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-haiku-4-5' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          # 주말 강제 실행 토글 (workflow_dispatch 의 force_brief=true 일 때)
          FORCE_BRIEF: ${{ github.event.inputs.force_brief || 'false' }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            ARGS="$ARGS --limit ${{ github.event.inputs.limit }}"
          fi
          if [ -n "${{ github.event.inputs.workers }}" ]; then
            ARGS="$ARGS --workers ${{ github.event.inputs.workers }}"
          fi
          python -m batch.run_batch --output web/data $ARGS

      - name: Enrich images (Unsplash) — cover 없는 신규 글 보강
        if: steps.freshness.outputs.skip != 'true'
        env:
          PYTHONUNBUFFERED: "1"
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: |
          python -m batch.enrich_images --limit 5 || true
          # 이미지 추가됐다면 build_blog 재실행해 HTML 갱신
          python -m batch.build_blog || true

      - name: Commit & push data + blog
        if: steps.freshness.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 데이터 JSON + 블로그 원고/빌드 결과 + RSS + sitemap 모두 커밋
          git add web/data web/posts web/blog web/rss.xml web/sitemap.xml 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          DATE=$(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M KST')
          git commit -m "chore(data): daily update + blog ${DATE}"
          # 동시 커밋 경합 대비 — rebase 충돌 시 배치 데이터 우선 merge 로 폴백
          for i in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            if git rebase "origin/${GITHUB_REF_NAME}"; then
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            else
              echo "rebase conflict detected, falling back to merge -X ours..."
              git rebase --abort
              git merge -X ours "origin/${GITHUB_REF_NAME}" --no-edit && \
                git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            fi
            echo "push retry $i..." && sleep 5
          done
          exit 1
